# gitleaks config for the "gitleaks" CI job (.github/workflows/tests.yml).
# Extends the built-in rules; see https://github.com/gitleaks/gitleaks#configuration
title = "wpaas-wsl-ubuntu"

[extend]
useDefault = true

[[allowlists]]
description = "Azure AD application, client and tenant ids in kube configs are public GUIDs, not secrets"
regexTarget = "line"
regexes = ['''(apiserver-id|client-id|tenant-id):\s*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''']
